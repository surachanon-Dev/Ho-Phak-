name: hophak_frontend
description: Ho-Phak frontend (mock data ตาม schema ฐานข้อมูล hopak – ยังไม่เชื่อม backend)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'  # Flutter 3.35 or newer (tested target: 3.44)

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  file_picker: ^10.0.0
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  intl: '>=0.19.0 <0.21.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
